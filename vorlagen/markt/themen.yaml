# Themen für das Themen-Ranking in Vinter.
# Du kannst Themen und Werte frei ändern, ergänzen oder löschen. Speichern genügt,
# beim nächsten Laden der Seite ist alles da.
#
# Format: Yahoo-Ticker: Anzeigename
#   US-Werte ohne Endung (NVDA), Deutschland .DE, Paris .PA, Amsterdam .AS, Mailand .MI,
#   Madrid .MC, London .L, Schweiz .SW, Stockholm .ST, Oslo .OL, Kopenhagen .CO, Wien .VI
# Den richtigen Ticker findest du auf finance.yahoo.com über die Suche.
# Ticker, die YAML als Ja/Nein lesen würde (ON, OFF, YES, NO, Y, N), in Anführungszeichen setzen: "ON".
#
# Eigene Logos (optional): Lege eine Bilddatei mit dem Ticker als Namen in daten/markt/logos/,
# z. B. daten/markt/logos/NVDA.png (erlaubt sind .png, .svg, .jpg, .webp). Ohne Logo steht nur der Ticker da.

