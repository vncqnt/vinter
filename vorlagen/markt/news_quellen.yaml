# Quellen und Regeln für den Newsfeed (Version 2, Neuaufbau ab 24.11.2026).
# Du kannst Quellen ergänzen, abschalten (aktiv: false) und Kanäle hinzufügen.
# Änderungen gelten beim nächsten Abruf, ein Neustart ist nicht nötig.
#
# art:
#   rss       RSS- oder Atom-Feed (Adresse unter "adresse")
#   telegram  öffentliche Telegram-Kanäle (Liste unter "telegram: kanaele"), Anmeldung im Tool
# stufe (für die Bewertung):
#   1 = Originalquelle (Behörde, Notenbank, Firma selbst über Newswire oder SEC)
#   2 = schnelle Eilmeldungen (Squawk, Telegram); gelten als "unbestätigt", bis eine zweite Quelle sie bringt
#   3 = Medien und Sammeldienste
# intervall_s   wie oft höchstens abgefragt wird (Sekunden). Bei Fehlern wartet Vinter automatisch länger.
# kontakt: sec  die Quelle verlangt eine Kontaktangabe, dafür wird SEC_USER_AGENT mitgeschickt
# formulare     nur bei der SEC: diese Meldungsarten werden behalten (der Rest ist Rauschen)

version: 2

quellen:
  - name: FinancialJuice
    art: rss
    adresse: https://www.financialjuice.com/feed.ashx?xy=rss
    stufe: 2
    intervall_s: 60
    hinweis: inoffizieller Feed, drosselt bei zu vielen Abfragen
  - name: SEC 8-K
    art: rss
    adresse: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&owner=include&count=40&output=atom
    stufe: 1
    intervall_s: 60
    kontakt: sec
  - name: SEC 6-K
    art: rss
    adresse: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=6-K&owner=include&count=40&output=atom
    stufe: 1
    intervall_s: 120
    kontakt: sec
  - name: GlobeNewswire
    art: rss
    adresse: https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies
    stufe: 1
    intervall_s: 60
  - name: PR Newswire
    art: rss
    adresse: https://www.prnewswire.com/rss/news-releases-list.rss
    stufe: 1
    intervall_s: 60
  - name: Business Wire
    art: rss
    adresse: https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFtRWA==
    stufe: 1
    intervall_s: 90
  - name: Weißes Haus
    art: rss
    adresse: https://www.whitehouse.gov/news/feed/
    stufe: 1
    intervall_s: 120
  - name: Weißes Haus Erlasse
    art: rss
    adresse: https://www.whitehouse.gov/presidential-actions/feed/
    stufe: 1
    intervall_s: 120
  - name: Fed
    art: rss
    adresse: https://www.federalreserve.gov/feeds/press_all.xml
    stufe: 1
    intervall_s: 180
  - name: EZB
    art: rss
    adresse: https://www.ecb.europa.eu/rss/press.html
    stufe: 1
    intervall_s: 180
  - name: BLS
    art: rss
    adresse: https://www.bls.gov/feed/bls_latest.rss
    stufe: 1
    intervall_s: 300
    kontakt: sec
  # Webseiten ohne Feed (art: seite): Links per Muster mit den Gruppen link, titel und optional zeit
  - name: USTR
    art: seite
    adresse: https://ustr.gov/about-us/policy-offices/press-office/press-releases
    stufe: 1
    intervall_s: 300
    muster: 'href="(?P<link>/about[^"]*?/press-releases/\d{4}/[a-z]+/[^"]+)"[^>]*>\s*(?P<titel>[^<]{15,300})</a>'
  - name: US-Finanzministerium
    art: seite
    adresse: https://home.treasury.gov/news/press-releases
    stufe: 1
    intervall_s: 300
    muster: '<time datetime=(?P<zeit>[0-9T:Z\-]+)[^>]*>.{0,400}?<a href=(?P<link>/news/press-releases/[a-z0-9]+/?)[^>]*>(?P<titel>[^<]+)</a>'
  - name: Telegram
    art: telegram
    stufe: 2

telegram:
  # Öffentliche Kanäle (Name ohne @). Nur lesen, Vinter postet nie etwas.
  kanaele: [WalterBloomberg]

# Vorspann, der von Schlagzeilen entfernt wird
vorspann: ["FinancialJuice:"]

# Schlagzeilen mit diesen Wörtern werden gar nicht gespeichert (Bilder ohne Text usw.)
ausblenden: [FJElite, Correlation Matrix, Implied Volatility, Currency Strength Chart]
